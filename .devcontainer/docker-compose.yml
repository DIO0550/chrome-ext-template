services:
  app:
    build:
      context: ./node
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      - NODE_ENV=development
      - GITHUB_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
    ports:
      - "3000:3000"
    command: sleep infinity
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
    name: mcp-network
